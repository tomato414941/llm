[run]
run_id = "pico_gpt2_tinyshakespeare"

[data]
tokens = "data/processed/tinyshakespeare_bpe_500.pt"
manifest = "data/manifest.example.toml"

[model]
block_size = 64
embedding_dim = 64
num_heads = 4
num_layers = 4
dropout = 0.1

[train]
max_iters = 3000
eval_interval = 300
eval_iters = 20
batch_size = 32
learning_rate = 0.001
min_learning_rate = 0.0001
warmup_iters = 100
lr_decay_iters = 3000
seed = 1337

[evaluation]
prompt_file = "eval_prompts/tinyshakespeare.jsonl"
eval_iters = 20
batch_size = 32

[outputs]
checkpoint = "checkpoints/pico-gpt2-tinyshakespeare.pt"
metrics = "experiments/runs/pico-gpt2-tinyshakespeare.csv"
observation = "experiments/observations/pico-gpt2-tinyshakespeare.md"
summary = "experiments/summaries/observations.csv"

[generation]
generate_tokens = 300
temperature = 1.0
top_k = 20
seed = 1337
samples = 3
