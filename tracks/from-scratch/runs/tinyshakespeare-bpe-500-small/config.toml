[run]
run_id = "tinyshakespeare_bpe_500_small"

[data]
tokens = "tracks/from-scratch/data/processed/tinyshakespeare_bpe_500.pt"
manifest = "tracks/from-scratch/data/manifests/tinyshakespeare-bpe-500.toml"

[model]
block_size = 32
embedding_dim = 32
num_heads = 4
num_layers = 2
dropout = 0.0

[train]
max_iters = 3000
eval_interval = 300
eval_iters = 20
batch_size = 32
learning_rate = 0.001
weight_decay = 0.1
seed = 1337

[evaluation]
prompt_file = "tracks/from-scratch/data/eval-prompts/tinyshakespeare.jsonl"
eval_iters = 20
batch_size = 32

[outputs]
checkpoint = "tracks/from-scratch/runs/tinyshakespeare-bpe-500-small/checkpoint.pt"
metrics = "tracks/from-scratch/runs/tinyshakespeare-bpe-500-small/metrics.csv"
observation = "tracks/from-scratch/runs/tinyshakespeare-bpe-500-small/observation.md"

[generation]
generate_tokens = 300
temperature = 1.0
top_k = 20
sampling = true
seed = 1337
samples = 1
