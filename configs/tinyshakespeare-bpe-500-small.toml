[run]
run_id = "tinyshakespeare_bpe_500_small"

[data]
tokens = "data/processed/tinyshakespeare_bpe_500.pt"
manifest = "data/manifest.example.toml"

[model]
block_size = 32
embedding_dim = 32
num_heads = 4
num_layers = 2
dropout = 0.0

[train]
max_iters = 3000
eval_interval = 300
eval_iters = 20
batch_size = 32
learning_rate = 0.001
seed = 1337

[evaluation]
prompt_file = "eval_prompts/tinyshakespeare.jsonl"
eval_iters = 20
batch_size = 32

[outputs]
checkpoint = "checkpoints/tinyshakespeare-bpe-500-small.pt"
metrics = "experiments/runs/tinyshakespeare-bpe-500-small.csv"
observation = "experiments/observations/tinyshakespeare-bpe-500-small.md"
summary = "experiments/summaries/observations.csv"

[generation]
generate_tokens = 300
temperature = 1.0
top_k = 20
seed = 1337
samples = 1
