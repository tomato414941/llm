[run]
run_id = "tinyshakespeare_bpe_500_medium"

[data]
tokens = "tracks/from-scratch/data/processed/tinyshakespeare_bpe_500.pt"
manifest = "tracks/from-scratch/data/manifests/tinyshakespeare-bpe-500.toml"

[model]
block_size = 64
embedding_dim = 64
num_heads = 4
num_layers = 4
dropout = 0.0

[train]
max_iters = 1000
eval_interval = 100
eval_iters = 20
batch_size = 32
learning_rate = 0.001
weight_decay = 0.1
seed = 1337

[evaluation]
prompt_file = "tracks/from-scratch/data/eval-prompts/tinyshakespeare.jsonl"
eval_iters = 20
batch_size = 32

[outputs]
checkpoint = "tracks/from-scratch/runs/tinyshakespeare-bpe-500-medium/checkpoint.pt"
metrics = "tracks/from-scratch/runs/tinyshakespeare-bpe-500-medium/metrics.csv"
observation = "tracks/from-scratch/runs/tinyshakespeare-bpe-500-medium/observation.md"

[generation]
generate_tokens = 200
temperature = 1.0
top_k = 20
sampling = true
seed = 1337
samples = 3
