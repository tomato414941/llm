[experiment]
name = "leverage_sft_qwen35_9b"
track = "leverage"
objective = "Run the reviewed-instruction LoRA/SFT baseline on Qwen3.5-9B."
status = "planned"

[model]
student = "Qwen/Qwen3.5-9B"
torch_dtype = "bfloat16"
selection_reason = "Qwen3.5-9B is the intended baseline after 0.8B smoke, 9B load, one-step train, and 32-row mini train passed."

[data]
reviewed-instructions = "tracks/leverage/datasets/reviewed-instructions/bootstrap.jsonl"
train_export = "tracks/leverage/sft/bootstrap.train.jsonl"
eval_tasks = [
  "tracks/leverage/evals/leverage-smoke.jsonl",
  "tracks/leverage/evals/project-judgment.jsonl",
]

[method]
first_choice = "lora"
fallback = "stop"
max_train_examples = 1200
max_epochs = 1
batch_size = 1
max_length = 512
gradient_checkpointing = true
gradient_accumulation_steps = 4
log_every_steps = 10
eval_max_new_tokens = 128
max_runtime_minutes = 60
notes = "This is the first full reviewed-data Qwen3.5-9B baseline run."

[runpod]
required = false
use_when = "Run only after dry-run confirms the exact GPU, config, outputs, timing, and cleanup plan."
gpu_target = "NVIDIA RTX 4090"
max_cost_usd = 1.00
cleanup_required = true

[outputs]
root = "outputs/leverage-sft-qwen35-9b"
adapter_dir = "outputs/leverage-sft-qwen35-9b/lora-adapter"
logs = "outputs/leverage-sft-qwen35-9b/logs"
metrics = "outputs/leverage-sft-qwen35-9b/metrics.csv"
notes = "outputs/leverage-sft-qwen35-9b/notes.md"

[success]
criteria = [
  "reviewed instructions validate successfully",
  "training export is regenerated from reviewed instructions",
  "training command completes on all exported reviewed rows",
  "adapter artifact is written",
  "metrics include rows, steps, tokens/sec, final loss, and peak VRAM",
]

[stop]
conditions = [
  "dependency setup exceeds the planned runtime",
  "Qwen3.5-9B cannot be loaded on the selected GPU",
  "loss becomes NaN",
  "cost cap would be exceeded",
  "any paid resource cannot be cleaned up immediately",
]
