[experiment]
name = "leverage_sft_qwen35_9b_batch2_200"
track = "leverage"
objective = "Measure Qwen3.5-9B LoRA/SFT throughput with batch_size=2 on 200 reviewed rows."
status = "planned"

[model]
student = "Qwen/Qwen3.5-9B"
torch_dtype = "bfloat16"
selection_reason = "Qwen3.5-9B is the intended baseline; this config only measures batch_size=2 throughput."

[data]
reviewed-instructions = "tracks/leverage/datasets/reviewed-instructions/bootstrap.jsonl"
train_export = "tracks/leverage/sft/bootstrap-200.train.jsonl"
eval_tasks = [
  "tracks/leverage/evals/leverage-smoke.jsonl",
  "tracks/leverage/evals/project-judgment.jsonl",
]

[method]
first_choice = "lora"
fallback = "stop"
max_train_examples = 200
max_epochs = 1
batch_size = 2
max_length = 512
gradient_checkpointing = true
gradient_accumulation_steps = 4
log_every_steps = 10
eval_max_new_tokens = 128
max_runtime_minutes = 30
notes = "Throughput measurement only; the train_export must be a 200-row slice generated from the reviewed export."

[runpod]
required = false
use_when = "Run only after dry-run confirms the 200-row train export and cleanup plan."
gpu_target = "NVIDIA RTX 4090"
max_cost_usd = 0.50
cleanup_required = true

[outputs]
root = "outputs/leverage-sft-qwen35-9b-batch2-200"
adapter_dir = "outputs/leverage-sft-qwen35-9b-batch2-200/lora-adapter"
logs = "outputs/leverage-sft-qwen35-9b-batch2-200/logs"
metrics = "outputs/leverage-sft-qwen35-9b-batch2-200/metrics.csv"
notes = "outputs/leverage-sft-qwen35-9b-batch2-200/notes.md"

[success]
criteria = [
  "training command completes on 200 exported reviewed rows",
  "progress log reports steps during training",
  "metrics include rows, steps, optimizer steps, tokens/sec, final loss, and peak VRAM",
]

[stop]
conditions = [
  "Qwen3.5-9B cannot train with batch_size=2 on the selected GPU",
  "loss becomes NaN",
  "cost cap would be exceeded",
  "any paid resource cannot be cleaned up immediately",
]
