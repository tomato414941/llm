[run]
run_id = "flow_check"

[data]
tokens = "tracks/from-scratch/data/processed/tinyshakespeare_bpe_500.pt"
manifest = "tracks/from-scratch/data/manifests/tinyshakespeare-bpe-500.toml"

[model]
block_size = 32
embedding_dim = 32
num_heads = 4
num_layers = 2
dropout = 0.0

[train]
max_iters = 20
eval_interval = 10
eval_iters = 2
batch_size = 8
learning_rate = 0.001
weight_decay = 0.1
seed = 1337

[evaluation]
prompt_file = "tracks/from-scratch/data/eval-prompts/tinyshakespeare.jsonl"
eval_iters = 2
batch_size = 8

[outputs]
checkpoint = "tracks/from-scratch/runs/flow-check/checkpoint.pt"
metrics = "tracks/from-scratch/runs/flow-check/metrics.csv"
observation = "tracks/from-scratch/runs/flow-check/observation.md"
summary = "tracks/from-scratch/runs/flow-check/summary.csv"

[generation]
generate_tokens = 80
temperature = 1.0
top_k = 20
sampling = true
seed = 1337
samples = 1
